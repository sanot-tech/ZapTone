name: 🔨 Build

# 🎯 What this does: builds ZapTone for Linux, Windows and macOS on every
#    push, then uploads the three files so you can download and run them.
#    Linux gets an AppImage, Windows gets one .exe, macOS gets a .dmg.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:        # 🖐️ run it by hand from the Actions tab

# 🔐 Never let two runs write into the same release
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────
  # 🐧 Linux: AppImage, one file, no installation
  # ─────────────────────────────────────────────────────────────
  linux:
    name: 🐧 Linux AppImage
    runs-on: ubuntu-24.04
    steps:
      - name: 📥 get the code
        uses: actions/checkout@v4

      - name: 🐍 set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 🧪 run the tests
        run: python3 -m unittest discover -s tests -v

      - name: 🎨 build the icons
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin imagemagick
          # 🎨 иконки строятся здесь, в Linux, где есть librsvg.
          #    Windows не умеет рендерить SVG, поэтому ZapTone.ico
          #    лежит в репозитории уже готовым.
          python3 scripts/make_icons.py

      - name: 📦 download appimagetool
        run: |
          # 🧰 appimagetool needs help from the system:
          #    mksquashfs writes the image, "file" detects file types,
          #    desktop-file-validate checks our .desktop file.
          sudo apt-get install -y -qq squashfs-tools file desktop-file-utils

          cd /tmp
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          # 🧹 an AppImage refuses to run as root in CI, so we unpack it and
          #    take the real binary out of it
          ./appimagetool-x86_64.AppImage --appimage-extract > /dev/null 2>&1 || true
          sudo mv squashfs-root/usr/bin/appimagetool /usr/local/bin/appimagetool
          sudo chmod +x /usr/local/bin/appimagetool
          # 🔧 KEY STEP: appimagetool looks for mksquashfs in its own ../lib
          #    folder and NOT in PATH. Without this copy it dies with
          #    "No such file or directory: .../lib/appimagekit/mksquashfs"
          sudo mkdir -p /usr/local/lib/appimagekit
          sudo cp "$(command -v mksquashfs)" /usr/local/lib/appimagekit/mksquashfs
          appimagetool --version

      - name: 🔨 build the AppImage
        run: ./scripts/build_appimage.sh

      - name: 📤 upload the AppImage
        uses: actions/upload-artifact@v4
        with:
          name: ZapTone-linux-x86_64
          path: dist/*.AppImage
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────
  # 🪟 Windows: one .exe, no Python needed on the user's computer
  # ─────────────────────────────────────────────────────────────
  windows:
    name: 🪟 Windows exe
    runs-on: windows-latest
    env:
      # 🪟 Кодировка консоли Windows по умолчанию cp1252, а в наших сообщениях
      #    есть эмодзи. UTF-8 решает это на уровне всего шага.
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"
    steps:
      - name: 📥 get the code
        uses: actions/checkout@v4

      - name: 🐍 set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 🧪 run the tests
        run: python -m unittest discover -s tests -v

      - name: 🔨 build the exe
        shell: pwsh
        run: |
          python -m pip install --quiet pyinstaller
          pyinstaller --clean --noconfirm windows/zaptone.spec

      - name: 📤 upload the exe
        uses: actions/upload-artifact@v4
        with:
          name: ZapTone-windows-x64
          path: dist/ZapTone.exe
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────
  # 🍎 macOS: .app bundle, then packed into a .dmg
  # ─────────────────────────────────────────────────────────────
  macos:
    name: 🍎 macOS app
    runs-on: macos-14
    steps:
      - name: 📥 get the code
        uses: actions/checkout@v4

      - name: 🐍 set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 🧪 run the tests
        run: python3 -m unittest discover -s tests -v

      - name: 🎨 build the icons
        run: |
          # 🍏 macOS has iconutil but not rsvg-convert, so we brew it first
          brew install librsvg imagemagick
          python3 scripts/make_icons.py

      - name: 🔨 build the app
        run: |
          python3 -m pip install --quiet pyinstaller
          pyinstaller --clean --noconfirm windows/zaptone.spec

      - name: 📦 make the dmg
        run: |
          # 🛡️ first check the bundle is really there. Without this check
          #    hdiutil fails with a confusing "No such file or directory"
          #    and nobody knows the real problem was the missing .app
          test -d dist/ZapTone.app || { echo "dist/ZapTone.app was not built"; exit 1; }
          ls -la dist/

          # 📦 make a real disk image: read only, compressed, with a volume name
          hdiutil create -volname "ZapTone" -srcfolder dist/ZapTone.app \
                  -ov -format UDZO dist/ZapTone-macOS.dmg
          # 📏 tell everyone how big it is
          ls -lh dist/ZapTone-macOS.dmg

      - name: 📤 upload the dmg
        uses: actions/upload-artifact@v4
        with:
          name: ZapTone-macOS
          path: dist/ZapTone-macOS.dmg
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────
  # ✅ one small job that waits for all three, so the badge is honest
  # ─────────────────────────────────────────────────────────────
  all-green:
    name: ✅ all platforms built
    needs: [linux, windows, macos]
    runs-on: ubuntu-24.04
    steps:
      - name: 🎉 done
        run: echo "Linux, Windows and macOS all built successfully."