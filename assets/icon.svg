<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="ZapTone">
  <!-- ══════════════════════════════════════════════════════════════════
       ZapTone app icon.
       Style follows the brand logo: a film frame with a play button, a
       lightning arrow in the middle, and a disc with a music note.
       Everything is vector, so it stays sharp from 16 px to 1024 px.

       Small-size rule: at 32 px only three shapes survive. That is why
       the film holes, the arrow and the note are big and simple, and why
       the glow is soft instead of sharp.
       ══════════════════════════════════════════════════════════════════ -->

  <defs>
    <!-- 🌌 background plate -->
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#231a3d"/>
      <stop offset="0.55" stop-color="#141024"/>
      <stop offset="1" stop-color="#0a0812"/>
    </linearGradient>

    <!-- 🎬 film frame: violet to blue -->
    <linearGradient id="frame" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#ff5fa2"/>
      <stop offset="0.45" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- 💿 disc: blue to cyan -->
    <linearGradient id="disc" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="0.5" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>

    <!-- ⚡ arrow: white to light cyan, so it pops on every background -->
    <linearGradient id="bolt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#c4f1ff"/>
    </linearGradient>

    <!-- 🌫️ soft glow. Three uses, all cheap, no filter chains on top -->
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowSoft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 🌑 background plate with a rounded corner, what every desktop expects -->
  <rect x="14" y="14" width="484" height="484" rx="114" fill="url(#plate)"/>
  <!-- ✨ glass highlight on the top edge -->
  <rect x="14" y="14" width="484" height="484" rx="114" fill="none"
        stroke="#ffffff" stroke-opacity="0.10" stroke-width="3"/>

  <!-- ══════════════════════════════════════════════════════════════
       🎬 FILM FRAME, left side, slightly tilted like the logo
       ══════════════════════════════════════════════════════════════ -->
  <g transform="rotate(-7 176 256)">
    <!-- 🔲 frame body with a thick gradient border -->
    <rect x="72" y="146" width="212" height="212" rx="42" fill="#120e22"/>
    <rect x="72" y="146" width="212" height="212" rx="42"
          fill="none" stroke="url(#frame)" stroke-width="20"/>

    <!-- 📽️ sprocket holes: two rows, they hold the shape at small sizes -->
    <g fill="#e9d5ff" opacity="0.92">
      <rect x="98"  y="112" width="30" height="17" rx="7"/>
      <rect x="142" y="112" width="30" height="17" rx="7"/>
      <rect x="186" y="112" width="30" height="17" rx="7"/>
      <rect x="98"  y="375" width="30" height="17" rx="7"/>
      <rect x="142" y="375" width="30" height="17" rx="7"/>
      <rect x="186" y="375" width="30" height="17" rx="7"/>
    </g>

    <!-- ▶️ play triangle, the reason this shape is a video -->
    <g filter="url(#glowSoft)">
      <path d="M150 208 L150 304 L232 256 Z" fill="url(#bolt)"/>
    </g>
  </g>

  <!-- ══════════════════════════════════════════════════════════════
       💿 DISC WITH A NOTE, right side
       ══════════════════════════════════════════════════════════════ -->
  <g transform="rotate(7 342 256)">
    <circle cx="342" cy="256" r="112" fill="#0f1b34"/>
    <circle cx="342" cy="256" r="112" fill="none" stroke="url(#disc)" stroke-width="20"/>
    <!-- 🔘 inner ring, like a real record -->
    <circle cx="342" cy="256" r="78" fill="none" stroke="#7dd3fc"
            stroke-opacity="0.35" stroke-width="5"/>

    <!-- 🎵 music note: stem, flag and the round head -->
    <!-- 🎵 music note: stem, flag, round head.
         The head sits at the bottom LEFT of the stem and touches it.
         Without that touch the shape reads as "n" or "r", not as a note. -->
    <g filter="url(#glowSoft)" fill="#ffffff">
      <path d="M374 166 L374 292" stroke="#ffffff" stroke-width="22" stroke-linecap="round"/>
      <path d="M374 166 C 410 176, 428 190, 428 212 L 428 242
               C 428 210, 408 200, 374 194 Z"/>
      <ellipse cx="343" cy="304" rx="36" ry="30" transform="rotate(-22 343 304)"/>
    </g>
  </g>

  <!-- ══════════════════════════════════════════════════════════════
       ⚡ THE ZAP: the arrow that turns a frame into a note.
       It sits on top of both shapes, so it reads as the action.
       ══════════════════════════════════════════════════════════════ -->
  <g filter="url(#glow)">
    <path d="M188 238 L246 238 L234 208 L306 264 L234 320 L246 290 L188 290 Z"
          fill="url(#bolt)" stroke="#0a0812" stroke-width="12" stroke-linejoin="round"/>
  </g>

  <!-- 🌟 three tiny sparkles, they add life without adding noise -->
  <g fill="#ffffff" opacity="0.85">
    <circle cx="424" cy="132" r="5"/>
    <circle cx="452" cy="164" r="3.5"/>
    <circle cx="86"  cy="396" r="4"/>
  </g>
</svg>