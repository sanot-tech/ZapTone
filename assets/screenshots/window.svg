<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" font-family="DejaVu Sans, Noto Sans, sans-serif">
  <!-- ═══════════════════════════════════════════════════════════════
       ZapTone window mockup, drawn as vector.
       It matches the real tkinter layout 1 to 1, so the README can show
       the interface without keeping a screenshot that goes out of date.
       Colors are the same as in zap_tone/ui.py (BG, PANEL, FG, ...).
       ═══════════════════════════════════════════════════════════════ -->

  <rect width="1000" height="700" fill="#0d0f16"/>

  <!-- 🪟 title bar -->
  <rect x="0" y="0" width="1000" height="42" fill="#181c26"/>
  <circle cx="28" cy="21" r="6" fill="#ff5f5f"/>
  <circle cx="50" cy="21" r="6" fill="#ffb04c"/>
  <circle cx="72" cy="21" r="6" fill="#3ddc84"/>
  <text x="500" y="27" fill="#8b93a7" font-size="14" text-anchor="middle">ZapTone 0.1.0</text>

  <!-- 🏷️ header: app name + tagline -->
  <text x="30" y="92" fill="#e8ecf4" font-size="34" font-weight="bold">⚡ ZapTone</text>
  <text x="268" y="90" fill="#8b93a7" font-size="15">Turn any video into a clean MP3. One file, every platform.</text>

  <!-- 📥 file queue card -->
  <rect x="30" y="112" width="940" height="290" rx="14" fill="#1b1f2b"/>
  <text x="50" y="146" fill="#8b93a7" font-size="14" font-weight="bold">📥 FILES</text>
  <text x="700" y="146" fill="#8b93a7" font-size="13">🧹 Clear</text>
  <text x="790" y="146" fill="#8b93a7" font-size="13">➕ Add folder</text>
  <text x="890" y="146" fill="#8b93a7" font-size="13">➕ Add files</text>
  <line x1="50" y1="160" x2="950" y2="160" stroke="#2b3244" stroke-width="1"/>

  <!-- table header -->
  <text x="60"  y="184" fill="#8b93a7" font-size="13">File</text>
  <text x="660" y="184" fill="#8b93a7" font-size="13">Size</text>
  <text x="770" y="184" fill="#8b93a7" font-size="13">Length</text>
  <text x="870" y="184" fill="#8b93a7" font-size="13">Status</text>

  <!-- rows -->
  <g font-size="13">
    <circle cx="66" cy="212" r="4" fill="#3ddc84"/>
    <text x="80"  y="217" fill="#e8ecf4">Daft Punk - Around The World.mp4</text>
    <text x="655" y="217" fill="#8b93a7">52 MB</text>
    <text x="772" y="217" fill="#8b93a7">7:03</text>
    <text x="865" y="217" fill="#3ddc84">done</text>

    <circle cx="66" cy="244" r="4" fill="#3ddc84"/>
    <text x="80"  y="249" fill="#e8ecf4">Artist - Album - Song (2024) [Live].mkv</text>
    <text x="655" y="249" fill="#8b93a7">1.2 GB</text>
    <text x="772" y="249" fill="#8b93a7">52:36</text>
    <text x="865" y="249" fill="#3ddc84">done</text>

    <circle cx="66" cy="276" r="4" fill="#ff8c42"/>
    <text x="80"  y="281" fill="#e8ecf4">Holiday video from the camera.webm</text>
    <text x="655" y="281" fill="#8b93a7">312 MB</text>
    <text x="772" y="281" fill="#8b93a7">12:48</text>
    <text x="865" y="281" fill="#ff8c42">working…</text>

    <circle cx="66" cy="308" r="4" fill="#8b93a7"/>
    <text x="80"  y="313" fill="#e8ecf4">Interview with the band.mp4</text>
    <text x="655" y="313" fill="#8b93a7">98 MB</text>
    <text x="772" y="313" fill="#8b93a7">24:10</text>
    <text x="865" y="313" fill="#8b93a7">waiting</text>

    <circle cx="66" cy="340" r="4" fill="#ff5f5f"/>
    <text x="80"  y="345" fill="#e8ecf4">broken_clip.avi</text>
    <text x="655" y="345" fill="#8b93a7">-</text>
    <text x="772" y="345" fill="#8b93a7">-</text>
    <text x="865" y="345" fill="#ff5f5f">no audio track</text>
  </g>

  <line x1="50" y1="360" x2="950" y2="360" stroke="#2b3244" stroke-width="1"/>
  <text x="50" y="386" fill="#8b93a7" font-size="12">5 files · 4 done · 1 working</text>

  <!-- ⚙️ settings card -->
  <rect x="30" y="418" width="940" height="132" rx="14" fill="#1b1f2b"/>

  <text x="50"  y="450" fill="#8b93a7" font-size="13">🎚️ Bitrate</text>
  <rect x="140" y="434" width="66" height="26" rx="6" fill="#12141c" stroke="#2b3244"/>
  <text x="158" y="452" fill="#e8ecf4" font-size="13">192</text>
  <path d="M190 444 l6 6 6 -6" stroke="#8b93a7" stroke-width="2" fill="none"/>

  <rect x="238" y="437" width="16" height="16" rx="4" fill="#ff8c42"/>
  <path d="M243 445 l4 4 7 -8" stroke="#12141c" stroke-width="2.5" fill="none"/>
  <text x="262" y="451" fill="#e8ecf4" font-size="13">VBR mode</text>

  <text x="370" y="450" fill="#8b93a7" font-size="13">🔊 Loudness</text>
  <rect x="462" y="437" width="16" height="16" rx="4" fill="#12141c" stroke="#3a4254"/>
  <text x="486" y="451" fill="#e8ecf4" font-size="13">even it out</text>

  <text x="600" y="450" fill="#8b93a7" font-size="13">✂️ Silence</text>
  <rect x="676" y="437" width="16" height="16" rx="4" fill="#12141c" stroke="#3a4254"/>
  <text x="700" y="451" fill="#e8ecf4" font-size="13">trim ends</text>

  <text x="50" y="492" fill="#8b93a7" font-size="13">📁 Output</text>
  <text x="128" y="492" fill="#8b93a7" font-size="13">same folder as the video</text>
  <rect x="300" y="478" width="90" height="26" rx="6" fill="#262c3d"/>
  <text x="322" y="496" fill="#e8ecf4" font-size="12">Browse</text>
  <rect x="398" y="478" width="130" height="26" rx="6" fill="#262c3d"/>
  <text x="414" y="496" fill="#e8ecf4" font-size="12">Same as video</text>

  <rect x="50" y="518" width="16" height="16" rx="4" fill="#ff8c42"/>
  <path d="M55 526 l4 4 7 -8" stroke="#12141c" stroke-width="2.5" fill="none"/>
  <text x="74" y="532" fill="#e8ecf4" font-size="13">Cover art from video</text>
  <rect x="220" y="518" width="16" height="16" rx="4" fill="#12141c" stroke="#3a4254"/>
  <text x="244" y="532" fill="#e8ecf4" font-size="13">Delete source after</text>

  <!-- 📊 progress + start button -->
  <rect x="30" y="574" width="700" height="8" rx="4" fill="#1b1f2b"/>
  <rect x="30" y="574" width="490" height="8" rx="4" fill="#ff8c42"/>
  <rect x="748" y="558" width="222" height="46" rx="10" fill="#ff8c42"/>
  <text x="859" y="588" fill="#1a1206" font-size="17" font-weight="bold" text-anchor="middle">⚡  CONVERT</text>

  <text x="30" y="632" fill="#8b93a7" font-size="13">✅ 70% — Holiday video from the camera.mp3</text>
  <text x="30" y="662" fill="#4d556b" font-size="11">This picture is a vector mockup of the real window. It is drawn from the same
     colors as the code, so it never gets out of date.</text>
</svg>